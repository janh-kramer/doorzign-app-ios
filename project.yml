# Xcode-Projekt wird mit XcodeGen erzeugt:  brew install xcodegen && xcodegen generate
name: DoorZign
options:
  bundleIdPrefix: de.doorzign
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""  # lokal setzen
packages:
  DoorZignKit:
    path: Packages/DoorZignKit
targets:
  DoorZign:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: DoorZignKit
        product: DoorZignAPI
      - package: DoorZignKit
        product: DoorZignCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.doorzign.app
        PRODUCT_NAME: DoorZign
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doorzign
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Die Kamera wird zum Scannen des Verbindungs-QR-Codes und für Fotos auf den Displays verwendet.
        NSPhotoLibraryUsageDescription: Fotos aus der Mediathek können als Bild auf einem Display angezeigt werden.
        NSLocalNetworkUsageDescription: Doorzign sucht im lokalen Netzwerk nach Doorzign-Edge-Gateways und verbindet sich mit ihnen.
        NSBonjourServices: [_doorzign._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: de.doorzign.app
            CFBundleURLSchemes: [doorzign]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Bewusst auch im Release (Koordination 2026-11-15): erlaubt .local und unqualifizierte Hostnamen
          # (Edge im LAN) sowie den Prism-Mock über http://localhost:4010. IP-Literale sind ohnehin von ATS ausgenommen.
          # Vertrauen/Pinning prüft unabhängig davon der PinningSessionDelegate (gepinnte Edge-CA).
          NSAllowsLocalNetworking: true
  DoorZignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: DoorZign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.doorzign.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DoorZign:
    build:
      targets:
        DoorZign: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoorZignUITests

